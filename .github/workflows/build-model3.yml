name: Build Model 3-Vulkan (macOS Apple Silicon)

# Apple Silicon only, and manual only.
#
# The Linux and macOS Intel release packages are built on the LAN laptop and uploaded by hand, so
# this workflow deliberately does not run on a tag push: an automatic run would rebuild from the
# tag and overwrite the assets that were just published (that happened once, v0.9.9.8). Dispatch it
# when an arm64 package is needed, download the artifact, and attach it to the release manually.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ninja

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Fetch third-party sources
        run: bash Scripts/fetch-cmake-deps.sh

      - name: Fetch MoltenVK
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/MoltenVK-macos.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.3.0/MoltenVK-macos.tar
          echo '57b4184ded521b08a63e3642552ebef8b9e98c2f0bcffa49bd93bbe1301c173d  /tmp/MoltenVK-macos.tar' \
            | shasum -a 256 -c -
          tar -xf /tmp/MoltenVK-macos.tar -C /tmp
          cp /tmp/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib Frameworks/
          cp /tmp/MoltenVK/MoltenVK/dynamic/dylib/macOS/MoltenVK_icd.json Frameworks/
          cp /tmp/MoltenVK/LICENSE Frameworks/LICENSE-MoltenVK.txt
          lipo -info Frameworks/libMoltenVK.dylib

      - name: Configure
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DUSE_SDL2=OFF -DUSE_SDL3=ON -DSUPERMODEL_SDL3_PURE_VULKAN=ON

      - name: Build
        run: cmake --build build-cmake --target Model3-Vulkan --parallel

      - name: Publish arm64 HostCore
        run: |
          set -euo pipefail
          # Native AOT defaults AppleMinOSVersion to 14.0 on osx; pin it to the executable's 13.3 so
          # the dylib loads on the same systems the emulator does.
          dotnet publish HostCore/Model3VulkanHostCore.csproj -c Release -r osx-arm64 \
            -o HostCore/publish-arm64 -p:AppleMinOSVersion=13.3
          cp HostCore/publish-arm64/libModel3VulkanHostCore.dylib build-cmake/bin/
          lipo -info build-cmake/bin/Model3-Vulkan
          lipo -info build-cmake/bin/libModel3VulkanHostCore.dylib

      - name: Package
        run: |
          set -euo pipefail
          bash Scripts/package-cmake.sh macOS
          VER=$(grep -E '^#define[[:space:]]+MODEL3VULKAN_VERSION' Src/Version.h | awk -F'"' '{print $2}')
          mv "Model3-Vulkan.v${VER}.for.macOS.tar.gz" \
             "Model3-Vulkan.v${VER}.for.macOS-AppleSilicon.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: Model3-Vulkan-macOS-AppleSilicon
          path: Model3-Vulkan.v*.for.macOS-AppleSilicon.tar.gz
          if-no-files-found: error
