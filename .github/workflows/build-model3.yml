name: Build Model 3-Vulkan (Linux / macOS)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  linux:
    # Pinned rather than "ubuntu-latest". The runner image decides the glibc and libstdc++ the
    # release binary links against, and "latest" has already moved to a glibc newer than any
    # supported target: the 0.9.8.6 tarball required GLIBC_2.43 and could not load on Ubuntu 24.04
    # (2.39) or on SteamOS, which is exactly the "closes immediately, no log" report from Steam
    # Deck users. 24.04 is also the oldest LTS that has g++-14, which <print> in the startup layer
    # needs. Raise this only with the guard step below updated to match.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-14 libdecor-0-dev \
            zlib1g-dev libwebp-dev unzip curl \
            libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Fetch third-party sources
        run: bash Scripts/fetch-cmake-deps.sh

      - name: Configure
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DUSE_SDL2=OFF -DUSE_SDL3=ON -DSUPERMODEL_SDL3_PURE_VULKAN=ON

      - name: Build
        run: cmake --build build-cmake --target Model3-Vulkan --parallel

      - name: Check the glibc/libstdc++ baseline
        run: |
          set -euo pipefail
          # Fails the build instead of shipping a binary that only runs on the build image. The
          # baseline is the oldest target we support: Ubuntu 24.04 (glibc 2.39, libstdc++ from
          # GCC 14) and SteamOS, which tracks slightly behind it.
          max_glibc=$(readelf -V build-cmake/bin/Model3-Vulkan \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          max_cxxabi=$(readelf -V build-cmake/bin/Model3-Vulkan \
            | grep -oE 'CXXABI_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -Vu | tail -1)
          echo "requires $max_glibc and $max_cxxabi"
          if [ "$max_glibc" != "GLIBC_2.39" ] && \
             [ "$(printf '%s\n%s\n' "$max_glibc" GLIBC_2.39 | sort -Vu | tail -1)" != "GLIBC_2.39" ]; then
            echo "::error::the binary requires $max_glibc, newer than the GLIBC_2.39 baseline"
            exit 1
          fi
          if [ "$max_cxxabi" != "CXXABI_1.3.15" ] && \
             [ "$(printf '%s\n%s\n' "$max_cxxabi" CXXABI_1.3.15 | sort -Vu | tail -1)" != "CXXABI_1.3.15" ]; then
            echo "::error::the binary requires $max_cxxabi, newer than the CXXABI_1.3.15 baseline (GCC 14)"
            exit 1
          fi

      - name: Publish HostCore
        run: cmake --build build-cmake --target hostcore

      - name: Package
        run: bash Scripts/package-cmake.sh Linux

      - uses: actions/upload-artifact@v4
        with:
          name: Model3-Vulkan-Linux
          path: Model3-Vulkan.v*.for.Linux.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ninja

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Fetch third-party sources
        run: bash Scripts/fetch-cmake-deps.sh

      - name: Fetch MoltenVK
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          curl -fsSL --retry 5 --retry-delay 2 \
            -o /tmp/MoltenVK-macos.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.3.0/MoltenVK-macos.tar
          echo "57b4184ded521b08a63e3642552ebef8b9e98c2f0bcffa49bd93bbe1301c173d  /tmp/MoltenVK-macos.tar" \
            | shasum -a 256 -c -
          tar -xf /tmp/MoltenVK-macos.tar -C /tmp
          cp /tmp/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib Frameworks/
          cp /tmp/MoltenVK/MoltenVK/dynamic/dylib/macOS/MoltenVK_icd.json Frameworks/
          cp /tmp/MoltenVK/LICENSE Frameworks/LICENSE-MoltenVK.txt
          file Frameworks/libMoltenVK.dylib
          lipo -info Frameworks/libMoltenVK.dylib

      - name: Configure
        run: |
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DUSE_SDL2=OFF -DUSE_SDL3=ON -DSUPERMODEL_SDL3_PURE_VULKAN=ON

      - name: Build
        run: cmake --build build-cmake --target Model3-Vulkan --parallel

      - name: Publish universal HostCore
        run: |
          set -euo pipefail
          # Native AOT defaults AppleMinOSVersion to 14.0 on osx, and a dylib built for 14.0 cannot
          # be loaded on macOS 13 (dyld: "built for macOS 14.0 which is newer than running OS").
          # Pin it to the executable's 13.3.
          dotnet publish HostCore/Model3VulkanHostCore.csproj -c Release -r osx-x64 -o HostCore/publish-x64 -p:AppleMinOSVersion=13.3
          dotnet publish HostCore/Model3VulkanHostCore.csproj -c Release -r osx-arm64 -o HostCore/publish-arm64 -p:AppleMinOSVersion=13.3
          lipo -create \
            -output build-cmake/bin/libModel3VulkanHostCore.dylib \
            HostCore/publish-x64/libModel3VulkanHostCore.dylib \
            HostCore/publish-arm64/libModel3VulkanHostCore.dylib
          file build-cmake/bin/libModel3VulkanHostCore.dylib
          lipo -info build-cmake/bin/libModel3VulkanHostCore.dylib

      - name: Package
        run: bash Scripts/package-cmake.sh macOS

      - uses: actions/upload-artifact@v4
        with:
          name: Model3-Vulkan-macOS
          path: Model3-Vulkan.v*.for.macOS.tar.gz
          if-no-files-found: error
