---
name: Build Supermodel

on:
  workflow_call:
    inputs:
      opt:
        description: "Optimization flags for compiler (e.g. -O3 -g)"
        type: string
        default: "-O3"

jobs:
  Build:
    strategy:
      # Without this the first platform to fail cancels the other two, which hides whether a fault is
      # platform-specific or common to all of them - the exact question when a build breaks only on
      # the compilers that are not MSVC.
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        include:
          - os: windows-latest
            makefile: Makefile.Win32
            shell: msys2 {0}
            pkg_pattern: "pkg/supermodel-*.zip"
          - os: ubuntu-latest
            makefile: Makefile.UNIX
            shell: bash
            pkg_pattern: "pkg/supermodel-*.tgz"
          - os: macos-latest
            makefile: Makefile.OSX
            shell: bash
            pkg_pattern: "pkg/supermodel-*.tgz"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      OPT_INPUT: ${{ inputs.opt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full git history (needed for changelog.sh script)
      
      - name: Install Ubuntu build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y libsdl2-dev libsdl2-net-dev libglu1-mesa-dev
          
      - name: Install Windows build dependencies
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            zip
            unzip
            git
            mingw64/mingw-w64-x86_64-gcc
            mingw64/mingw-w64-x86_64-SDL2
            mingw64/mingw-w64-x86_64-SDL2_net

      # Vulkan-Headers are not committed: Libraries/ is ignored wholesale and they are fetched by
      # Libraries/Get_Vulkan.cmd on a developer machine. The CI never ran that script, so the first
      # Vulkan source file failed with "vulkan/vulkan.h: No such file or directory". Upstream never
      # hit this because it has no Vulkan backend at all.
      #
      # Fetched natively rather than by running the .cmd, because this workflow is a matrix over
      # Ubuntu, Windows and macOS and a batch file only covers one of them. The version matches
      # Get_Vulkan.cmd so a CI build and a local build see the same headers.
      - name: Fetch Vulkan headers
        run: |
          mkdir -p Libraries
          curl -fsSL -o /tmp/vk-headers.zip \
            https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.3.296.zip
          unzip -q /tmp/vk-headers.zip -d /tmp/vk-headers
          mv /tmp/vk-headers/Vulkan-Headers-1.3.296 Libraries/Vulkan-Headers
          test -f Libraries/Vulkan-Headers/include/vulkan/vulkan.h

      - name: Build Supermodel
        run: |
          set -o pipefail
          make -f Makefiles/${{ matrix.makefile }} release OPT="${OPT_INPUT:-"-O3"}" GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} SILENT= 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            {
              echo "### Build failed on ${{ matrix.os }}"
              echo '```'
              grep -E 'error:|fatal error|Error [0-9]|undefined reference' build.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi

      # Only reached when the build above failed: the compile log is otherwise unreadable without
      # admin rights on the repository (the job-log API refuses, and the web UI is a browser).
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore

      - name: Validate build
        run: |
          # Find the executable in bin/ directory (bin64/ on Windows)
          set -o pipefail
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./bin64/supermodel.exe -print-games 2>&1 | tee validate.log
          else
            ./bin/supermodel -print-games 2>&1 | tee validate.log
          fi
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### Validation failed on ${{ matrix.os }}"
              echo '```'
              tail -40 validate.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
          # Remove the auto-generated default Supermodel.ini. On Unix it lands in the working
          # directory's Config; on Windows GetPath() anchors it to the executable's Data/Config, so
          # the path below does not exist there and -f keeps the step from failing over it.
          rm -f Config/Supermodel.ini
          
      - name: Create package
        run: |
          set -o pipefail
          make -f Makefiles/${{ matrix.makefile }} pkg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} SILENT= 2>&1 | tee package.log
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### Packaging failed on ${{ matrix.os }}"
              echo '```'
              grep -E 'error|Error|fatal|No such|Permission denied|not found' package.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi
          
      - name: Find and upload package
        run: |
          # Find the package file created by Makefile
          PKG_FILES=(${{ matrix.pkg_pattern }})
          if [ ${#PKG_FILES[@]} -eq 0 ] || [ ! -f "${PKG_FILES[0]}" ]; then
            echo "No package files found matching pattern: ${{ matrix.pkg_pattern }}"
            echo "Available files in pkg/:"
            ls -la pkg/ 2>/dev/null || echo "pkg directory is empty or doesn't exist"
            exit 1
          fi
          
          PKG_FILE="${PKG_FILES[0]}"
          echo "Found package: $PKG_FILE"
          
          # This fork has its own version and date in Src/Version.h. Do not use `make version`
          # here: that target reports the upstream core version, which is also compiled into
          # SUPERMODEL_VERSION and written into save states.
          FORK_VERSION=$(grep -E '^#define[[:space:]]+SUPERMODEL_FORK_VERSION' Src/Version.h | awk -F'"' '{print $2}')
          FORK_DATE=$(grep -E '^#define[[:space:]]+SUPERMODEL_FORK_DATE' Src/Version.h | awk -F'"' '{print $2}')
          PLATFORM="${{ runner.os }}"
          
          # Copy the package with the name used for distribution. GitHub turns spaces in release
          # asset names into dots; use dots directly so the name is stable and the release action
          # recognises (and replaces) an asset it uploaded on an earlier run.
          if [[ "$PKG_FILE" == *.zip ]]; then
            NEW_NAME="Supermodel-VK.v${FORK_VERSION}-${FORK_DATE}.for.${PLATFORM}.zip"
          else
            NEW_NAME="Supermodel-VK.v${FORK_VERSION}-${FORK_DATE}.for.${PLATFORM}.tar.gz"
          fi
          
          cp "$PKG_FILE" "$NEW_NAME"
          echo "package_file=$NEW_NAME" >> $GITHUB_ENV
          
      - uses: actions/upload-artifact@v4
        with:
          name: Supermodel-VK-${{ runner.os }}
          path: ${{ env.package_file }}