name: Build and Release

on:
  push:
    branches: [ master ]  # Auto-build on master
  workflow_dispatch:      # Manual triggering
    inputs:
      opt:
        description: "Optimization flags"
        type: string
        default: "-O3 -g"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      opt: ${{ github.event.inputs.opt || '-O3 -g' }}
  
  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          # The fork's own version, not the upstream core version that `make version` prints.
          FORK_VERSION=$(grep -E '^#define[[:space:]]+SUPERMODEL_FORK_VERSION' Src/Version.h | awk -F'"' '{print $2}')
          FORK_DATE=$(grep -E '^#define[[:space:]]+SUPERMODEL_FORK_DATE' Src/Version.h | awk -F'"' '{print $2}')
          echo "version=v${FORK_VERSION}-${FORK_DATE}" >> $GITHUB_OUTPUT
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug downloaded artifacts
        run: |
          echo "=== Downloaded artifacts structure ==="
          find artifacts -type f -name "*.zip" -o -name "*.tar.gz" | sort
          echo "=== End debug ==="
          
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.version }}"
          name: "Supermodel-VK ${{ steps.version.outputs.version }}"
          files: |
            artifacts/*/*.zip
            artifacts/*/*.tar.gz
          body: "Automated Supermodel-VK build for Windows, Linux and macOS."
          draft: false
          prerelease: false
          generate_release_notes: true