name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # Manual triggering

jobs:
  build:
    uses: ./.github/workflows/build-model3.yml
  
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          # The fork's own version, not the upstream core version that `make version` prints.
          FORK_VERSION=$(grep -E '^#define[[:space:]]+MODEL3VULKAN_VERSION' Src/Version.h | awk -F'"' '{print $2}')
          echo "version=v${FORK_VERSION}" >> $GITHUB_OUTPUT

          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug downloaded artifacts
        run: |
          echo "=== Downloaded artifacts structure ==="
          find artifacts -type f -name "*.zip" -o -name "*.tar.gz" | sort
          echo "=== End debug ==="
          
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.version.outputs.version }}"
          name: "Model 3-Vulkan ${{ steps.version.outputs.version }}"
          files: |
            artifacts/*/*.tar.gz
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
